# Alternative pipeline: AWS CodePipeline + CodeBuild (instead of GitHub Actions).
# CodeBuild free tier: 100 build minutes/month.
#
# In the CodeBuild project, set environment variables:
#   S3_BUCKET            = your bucket name
#   VITE_GEMINI_API_KEY  = your Gemini key (mark as "Parameter" via SSM for safety)
#   CLOUDFRONT_DIST_ID   = optional

version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
  build:
    commands:
      - npm run build
  post_build:
    commands:
      - aws s3 sync dist/ "s3://${S3_BUCKET}" --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html"
      - aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" --cache-control "public,max-age=60"
      - |
        if [ -n "$CLOUDFRONT_DIST_ID" ]; then
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DIST_ID" --paths "/index.html"
        fi

artifacts:
  base-directory: dist
  files:
    - '**/*'
