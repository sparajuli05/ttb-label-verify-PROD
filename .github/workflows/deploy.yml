# CI/CD: build, test, deploy to AWS S3 (+ optional CloudFront invalidation)
# All services used are AWS Free Tier eligible.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID       – IAM user access key (deploy-only permissions)
#   AWS_SECRET_ACCESS_KEY   – IAM user secret key
#   AWS_REGION              – e.g. us-east-1
#   S3_BUCKET               – your bucket name, e.g. ttb-label-verify-suresh
#   VITE_GEMINI_API_KEY     – Gemini key baked into the static build
#   CLOUDFRONT_DIST_ID      – (optional) CloudFront distribution ID

name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          # Long-cache hashed assets, short-cache index.html
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html "s3://${{ secrets.S3_BUCKET }}/index.html" \
            --cache-control "public,max-age=60"

      - name: Invalidate CloudFront (optional)
        if: ${{ secrets.CLOUDFRONT_DIST_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DIST_ID }}" \
            --paths "/index.html"
